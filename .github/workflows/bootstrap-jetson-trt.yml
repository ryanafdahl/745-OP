name: Legacy Jetson bootstrap (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Do not overwrite the audited source branch
        run: |
          echo 'The bootstrap was a one-time import and is now retired.'
          echo 'Its historical recipe is retained in Git history at c062e3c7c31ffe3384910aec46b6e89492ba252c.'
          echo 'Use reviewed, forward-only commits for future ports. This workflow never pushes or resets a branch.'
          echo 'Run the source audit separately; a green source audit is not hardware qualification.'
