name: Bootstrap Jetson TRT

on:
  push:
    branches: [jetson-trt]
    paths: [.github/workflows/bootstrap-jetson-trt.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import nrdr-clean and port Jetlink/TensorRT
        shell: bash
        run: |
          set -euo pipefail

          if git log -1 --pretty=%B | grep -q "\[jetson-trt-integrated\]"; then
            echo "Already integrated; skipping recursive workflow run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/nrdr /tmp/zoom
          git clone --filter=blob:none --no-checkout https://github.com/nrdr/openpilot.git /tmp/nrdr
          git -C /tmp/nrdr fetch --no-tags origin nrdr-clean
          git -C /tmp/nrdr checkout --detach "$(git -C /tmp/nrdr rev-parse FETCH_HEAD)"

          git clone --branch jetson-trt --single-branch https://github.com/zoompilot/zoompilot.git /tmp/zoom
          git -C /tmp/zoom checkout --detach bcb49d740eb7f7181c2c4aba6de5177b03f88ba3

          NRDR_SHA=$(git -C /tmp/nrdr rev-parse HEAD)
          ZOOM_SHA=$(git -C /tmp/zoom rev-parse HEAD)

          # Preserve this workflow across the reset so the finished branch keeps
          # a reproducible/manual Jetlink integration tool.
          cp .github/workflows/bootstrap-jetson-trt.yml /tmp/bootstrap-jetson-trt.yml

          # Start from a clean nrdr-clean tree. Do not overwrite existing nrdr
          # integration files with their final Zoompilot versions.
          cd "$GITHUB_WORKSPACE"
          git remote add nrdr https://github.com/nrdr/openpilot.git || true
          git fetch nrdr nrdr-clean
          git reset --hard "$NRDR_SHA"

          # Restore the workflow that the reset removed.
          mkdir -p .github/workflows
          cp /tmp/bootstrap-jetson-trt.yml .github/workflows/bootstrap-jetson-trt.yml

          # Import files directly from the checked-out Zoompilot tree. The Zoom
          # commit is not an object in this destination repository, so using
          # "git checkout \"$ZOOM_SHA\"" here would address the wrong object database.
          for path in \
            openpilot/sunnypilot/accelerators \
            openpilot/selfdrive/ui/sunnypilot/accelerator_link.py \
            openpilot/selfdrive/selfdrived/tests/test_big_model_ready.py \
            openpilot/selfdrive/ui/tests/test_accelerator_ui.py \
            openpilot/sunnypilot/selfdrive/selfdrived/accelerator_events.py \
            openpilot/sunnypilot/selfdrive/selfdrived/tests/test_accelerator_events.py \
            openpilot/sunnypilot/selfdrive/selfdrived/tests/test_big_model_availability.py \
            tools/jetlink_bench.py \
            tools/jetlink_live_bench.sh \
            tools/jetlink_replay.py; do
            mkdir -p "$GITHUB_WORKSPACE/$(dirname "$path")"
            cp -a "/tmp/zoom/$path" "$GITHUB_WORKSPACE/$path"
          done

          # Preserve Zoompilot's exact Jetlink gitlink revision.
          JETLINK_SHA=$(git -C /tmp/zoom ls-tree "$ZOOM_SHA" -- jetlink_repo | awk '{print $3}')
          test -n "$JETLINK_SHA"
          git update-index --add --cacheinfo 160000,"$JETLINK_SHA",jetlink_repo
          mkdir -p jetlink_repo

          # nrdr-clean has no .gitmodules. Add only the Jetlink submodule.
          printf '%s\n' '[submodule "jetlink"]' '  path = jetlink_repo' '  url = https://github.com/zoompilot/jetlink.git' > .gitmodules

          # Apply the reviewed accelerator port; do not replay superseded history.
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import re
          
          p = Path("openpilot/common/params_keys.h")
          s = p.read_text()
          source = Path("/tmp/zoom/openpilot/common/params_keys.h").read_text()
          keys = ["JetlinkEnabled","JetlinkEndpoint","JetlinkModel","JetlinkEngineReady","JetlinkSpec","JetlinkCachedModels","JetlinkModelPointers","AcceleratorProgress","Offroad_AcceleratorUnavailable"]
          marker = '    {"Version", {PERSISTENT, STRING}},'
          assert s.count(marker) == 1, "NRDR params registry anchor changed"
          for key in keys:
              matches = [line for line in source.splitlines() if re.match(r'\s*\{"' + key + r'"\s*,', line)]
              assert len(matches) == 1, f"Missing or duplicate upstream parameter: {key}"
              if not re.search(r'\{"' + key + r'"\s*,', s):
                  s = s.replace(marker, matches[0] + "\n" + marker)
              assert len(re.findall(r'\{"' + key + r'"\s*,', s)) == 1, key
          p.write_text(s)
          
          # Apply the final accelerator API to NRDR's current modeld once. Replaying
          # superseded Jetlink startup implementations conflicts with native readiness.
          p = Path("openpilot/selfdrive/modeld/modeld.py")
          s = p.read_text()
          replacements = [
            [
              "from openpilot.sunnypilot.livedelay.helpers import get_lat_delay",
              "from openpilot.sunnypilot import accelerators\nfrom openpilot.sunnypilot.livedelay.helpers import get_lat_delay"
            ],
            [
              "  config_realtime_process(7, 54)",
              "  # Prepare the accelerator before modeld enters the realtime scheduling class.\n  JETLINK = not CHESTNUT and accelerators.enabled() and accelerators.prepare()\n\n  config_realtime_process(7, 54)"
            ],
            [
              "  small_model = ModelState(vipc_client_main.width, vipc_client_main.height, False) if model is None or CHESTNUT else None",
              "  elif JETLINK:\n    small_model = ModelState(vipc_client_main.width, vipc_client_main.height, False)\n    try:\n      model = accelerators.make_model_state(vipc_client_main.width, vipc_client_main.height, small_model)\n    except Exception:\n      cloudlog.exception(\"jetlink load failed\")\n      model = None\n\n  if not JETLINK:\n    small_model = ModelState(vipc_client_main.width, vipc_client_main.height, False) if model is None or CHESTNUT else None"
            ],
            [
              "  chestnut_state = ChestnutState(pm, model.chestnut) if CHESTNUT else None",
              "  chestnut_state = ChestnutState(pm, model.chestnut) if CHESTNUT else None\n  if JETLINK:\n    chestnut_state = accelerators.make_status_publisher(pm, model)"
            ],
            [
              "    except Exception:\n      if not params.get_bool(\"ChestnutActive\"):",
              "    except Exception:\n      # The joining state owns its fallback and link cleanup.\n      if JETLINK:\n        raise\n      if not params.get_bool(\"ChestnutActive\"):"
            ],
            [
              "      set_lateral_action_timing(modelv2_send, mdv2sp_send, lat_action_t)",
              "      set_lateral_action_timing(modelv2_send, mdv2sp_send, lat_action_t)\n      mdv2sp_send.modelDataV2SP.bigModelAvailable = getattr(model, 'big_model_available', False)\n      mdv2sp_send.modelDataV2SP.acceleratorState = getattr(model, 'big_model_state', 'none')\n      mdv2sp_send.modelDataV2SP.acceleratorName = 'jetlink' if JETLINK else ''"
            ]
          ]
          for old, new in replacements:
              assert s.count(old) == 1, f"NRDR modeld anchor changed: {old}"
              s = s.replace(old, new)
          ast.parse(s)
          p.write_text(s)
          
          # Keep NRDR's native hardware readiness logic and add only pkl validation.
          p = Path("openpilot/selfdrive/modeld/helpers.py")
          s = p.read_text()
          marker = "def chestnut_present() -> bool:"
          assert s.count(marker) == 1
          s = s.replace(marker, "# the top level of the pkl compile_modeld.py writes. checked at both ends: a pkl from another\n# compile_modeld.py unpickles fine and only fails on the first key it lacks, as a bare KeyError\nMODELD_PKL_KEYS = ('metadata', 'input_devices', 'run_model')\n\ndef check_modeld_pkl(jits: dict, path) -> None:\n  missing = [k for k in MODELD_PKL_KEYS if k not in jits]\n  if missing:\n    raise RuntimeError(f\"{path} is missing {missing}: it was compiled by a different compile_modeld.py than this modeld, rebuild it\")\n\n# every warp jit is compiled for one driver camera resolution and keyed by it, so a prebuilt cut\n# on a device with a different camera carries none for this one. Without this the mismatch\n# surfaces as a bare FileNotFoundError or KeyError inside ModelState.__init__ and the process\n# just stops. See PREBUILT_ALL_CAMERAS in modeld/SConscript\ndef _camera_mismatch(cam_w: int, cam_h: int, compiled: str, path) -> RuntimeError:\n  have = f\"{path} has only [{compiled or 'none'}]\"\n  return RuntimeError(f\"no jit for this device's {cam_w}x{cam_h} driver camera: {have}. This build was compiled for another device\")\n\ndef dm_warp_path(cam_w: int, cam_h: int):\n  path = MODELS_DIR / f'dm_warp_{cam_w}x{cam_h}_tinygrad.pkl'\n  if not path.is_file():\n    compiled = ', '.join(sorted(p.name.split('_')[2] for p in MODELS_DIR.glob('dm_warp_*_tinygrad.pkl')))\n    raise _camera_mismatch(cam_w, cam_h, compiled, MODELS_DIR)\n  return path\n\ndef check_camera_jit(jits: dict, cam_w: int, cam_h: int, path) -> None:\n  if (cam_w, cam_h) not in jits:\n    compiled = ', '.join(f'{w}x{h}' for w, h in sorted(k for k in jits if isinstance(k, tuple)))\n    raise _camera_mismatch(cam_w, cam_h, compiled, path)\n\n" + marker)
          ast.parse(s)
          p.write_text(s)
          
          # Reviewed net changes against the pinned NRDR base. Every input blob must
          # match before applying offsets; upstream movement cannot silently misapply a patch.
          import json
          import subprocess
