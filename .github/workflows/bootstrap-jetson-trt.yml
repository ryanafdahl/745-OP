          """Run upstream joining tests with hardware/IPC dependencies stubbed."""
          import importlib.util
          import sys
          import types
          import unittest
          from pathlib import Path
          from unittest import mock
          
          def module(name):
              if name in sys.modules:
                  return sys.modules[name]
              m = types.ModuleType(name)
              m.__path__ = []
              sys.modules[name] = m
              if "." in name:
                  parent, child = name.rsplit(".", 1)
                  setattr(module(parent), child, m)
              return m
          
          for name in ("openpilot.cereal.messaging", "openpilot.sunnypilot.accelerators",
                       "openpilot.sunnypilot.accelerators.jetlink.helpers"):
              module(name)
          module("openpilot.common.realtime").drop_realtime = lambda: None
          module("openpilot.common.realtime").set_core_affinity = lambda cores: None
          module("openpilot.common.swaglog").cloudlog = mock.Mock()
          module("openpilot.common.basedir").BASEDIR = str(Path(".").resolve())
          module("openpilot.sunnypilot.accelerators.jetlink.helpers").CC_ORIENTATION = mock.Mock()
          module("openpilot.sunnypilot.accelerators.jetlink.helpers").CC_ORIENTATION.read_text.return_value = "1"
          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              m = module(name)
              spec.loader.exec_module(m)
              return m
          load("openpilot.sunnypilot.accelerators.jetlink.joining", "openpilot/sunnypilot/accelerators/jetlink/joining.py")
          tests = load("test_joining", "openpilot/sunnypilot/accelerators/jetlink/tests/test_joining.py")
          result = unittest.TextTestRunner(verbosity=1).run(unittest.defaultTestLoader.loadTestsFromModule(tests))
          sys.exit(not result.wasSuccessful())
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq capnproto
          capnp compile -I openpilot/cereal -o- openpilot/cereal/custom.capnp >/dev/null

          git add .gitmodules .github/workflows/bootstrap-jetson-trt.yml jetlink_repo
