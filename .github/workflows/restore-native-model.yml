name: Restore pinned native ONNX build input
on:
  push:
    branches: [jetson-trt]
    paths: [.github/workflows/restore-native-model.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jetson-trt
      - name: Download, verify, and chunk the exact source asset
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, urllib.request
          from pathlib import Path
          manifest = json.loads(Path("tools/jetson_model_sources.json").read_text())
          spec = importlib.util.spec_from_file_location("chunker", "openpilot/common/file_chunker.py")
          chunker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(chunker)
          for model in manifest["models"]:
            url = "https://media.githubusercontent.com/media/" + manifest["source_repository"] + "/" + manifest["source_revision"] + "/" + model["path"]
            path = Path(model["path"])
            with urllib.request.urlopen(url, timeout=120) as src, path.open("wb") as dst:
              digest, size = hashlib.sha256(), 0
              while data := src.read(1024 * 1024):
                dst.write(data)
                digest.update(data)
                size += len(data)
            assert size == model["size"], (size, model["size"])
            assert digest.hexdigest() == model["sha256"]
            chunker.chunk_file(str(path), chunker.get_chunk_targets(str(path), size))
          PY
          python3 tools/check_jetson_model_sources.py
      - name: Publish restored input without rewriting history
        run: |
          set -euo pipefail
          git add -f openpilot/selfdrive/modeld/models/driving_supercombo.onnx.chunk*
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore hash-verified NRDR native driving ONNX chunks for first-boot compilation"
          git push origin HEAD:jetson-trt
