name: Verify comma short installer
on:
  push:
    branches: [jetson-trt]
    paths: [.github/workflows/verify-short-installer.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify branch and compiled installer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads https://github.com/ryanafdahl/openpilot.git refs/heads/nrdr-jetstream | cut -f1)" = 92c539b5d737915db3b3976967a4ff4080328145
          curl --fail --location --retry 3 --user-agent 'AGNOSSetup-19.7' -H 'X-openpilot-device-type: mici' https://installer.comma.ai/ryanafdahl/nrdr-jetstream -o /tmp/comma-installer
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          data = Path("/tmp/comma-installer").read_bytes()
          assert data[:4] == b"\x7fELF", f"setup requires an ELF executable; response: {data[:200]!r}"
          assert b"https://github.com/ryanafdahl/openpilot.git" in data, "wrong repository"
          assert b"nrdr-jetstream" in data, "wrong branch"
          print("Verified installer ELF, repository, and branch.")
          print("SHA256:", hashlib.sha256(data).hexdigest())
          PY

      - name: Diagnose AGNOS setup compatibility responses
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          for version in ("12.8", "14.1", "15.1", "16.1", "17.1", "18.1", "19.3", "19.7"):
            url = "https://installer.comma.ai/ryanafdahl/nrdr-jetstream"
            req = urllib.request.Request(url, headers={"User-Agent": "AGNOSSetup-" + version, "X-openpilot-device-type": "mici"})
            try:
              with urllib.request.urlopen(req, timeout=30) as response:
                data = response.read(256)
                print(json.dumps({"agnos":version,"status":response.status,"elf":data.startswith(b"\x7fELF"),"body":None if data.startswith(b"\x7fELF") else data.decode("utf8","replace")}))
            except urllib.error.HTTPError as exc:
              print(json.dumps({"agnos":version,"status":exc.code,"body":exc.read(1000).decode("utf8","replace")}))
          PY

      - name: Compare exact branch spelling
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          for branch in ("nrdr-jetstream", "nrdr-jetson", "nrdr-OP-jetson-trt", "nrdr-op-jetson-trt"):
            url = "https://installer.comma.ai/ryanafdahl/" + branch
            req = urllib.request.Request(url, headers={"User-Agent":"AGNOSSetup-18.4","X-openpilot-device-type":"mici"})
            try:
              with urllib.request.urlopen(req, timeout=30) as response:
                data=response.read()
                assert data.startswith(b"\x7fELF"), f"{branch}: expected compiled installer"
                assert branch.encode() in data, f"{branch}: wrong embedded branch"
                assert b"https://github.com/ryanafdahl/openpilot.git" in data
                print(json.dumps({"branch":branch,"status":response.status,"elf":data.startswith(b"\x7fELF"),"body":None if data.startswith(b"\x7fELF") else data.decode("utf8","replace")}))
            except urllib.error.HTTPError as exc:
              print(json.dumps({"branch":branch,"status":exc.code,"body":exc.read(1000).decode("utf8","replace")}))
              raise
          PY

      - name: Verify model inputs in an anonymous installation clone
        run: |
          git clone --depth=1 --recurse-submodules --branch nrdr-jetstream https://github.com/ryanafdahl/openpilot.git "$RUNNER_TEMP/install-clone"
          python3 "$RUNNER_TEMP/install-clone/tools/check_jetson_model_sources.py"
